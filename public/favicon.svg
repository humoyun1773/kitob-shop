<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="8" stroke-opacity="0.5" />

  <!-- Background Glow behind book -->
  <circle cx="256" cy="256" r="140" fill="#F59E0B" opacity="0.12" filter="url(#glow)" />

  <!-- Magic / Star Sparkle at Top -->
  <path d="M256 96 L264 126 L294 134 L264 142 L256 172 L248 142 L218 134 L248 126 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="340" cy="148" r="7" fill="#FDE68A" opacity="0.9" />
  <circle cx="172" cy="148" r="5" fill="#FDE68A" opacity="0.8" />

  <!-- Open Book Base / Pages -->
  <!-- Left Page -->
  <path d="M256 384 C220 360 144 356 100 364 C90 366 84 358 84 348 L84 212 C84 204 90 198 98 196 C144 186 220 192 256 220 Z" fill="url(#pageLeft)" />
  
  <!-- Right Page -->
  <path d="M256 384 C292 360 368 356 412 364 C422 366 428 358 428 348 L428 212 C428 204 422 198 414 196 C368 186 292 192 256 220 Z" fill="url(#pageRight)" />

  <!-- Center Spine / Fold Shadow -->
  <path d="M252 216 L252 388 C254 390 258 390 260 388 L260 216 C258 214 254 214 252 216 Z" fill="#0F172A" opacity="0.4" />

  <!-- Book Pages Thickness / Underlayer -->
  <path d="M100 364 C144 356 220 360 256 384 C292 360 368 356 412 364 L416 376 C372 368 296 372 256 396 C216 372 140 368 96 376 Z" fill="#D97706" />

  <!-- Text lines on left page -->
  <path d="M128 240 C160 236 210 240 232 252" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35" />
  <path d="M128 272 C160 268 210 272 232 284" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35" />
  <path d="M128 304 C160 300 210 304 232 316" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35" />

  <!-- Text lines on right page -->
  <path d="M280 252 C302 240 352 236 384 240" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35" />
  <path d="M280 284 C302 272 352 268 384 272" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35" />
  <path d="M280 316 C302 304 352 300 384 304" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35" />

  <!-- Golden Bookmark Ribbon -->
  <path d="M246 220 L246 320 L256 312 L266 320 L266 220 Z" fill="#EF4444" />
</svg>